[project]
name = "khalij-watch"
version = "0.1.0"
description = "Persian Gulf maritime domain awareness: Sentinel-1 SAR vessel detection fused with AIS to surface dark vessels"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "geoalchemy2>=0.15",
    "numpy>=1.26,<2.2",
    "scipy>=1.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.4",
    "pyais>=2.6",
    "structlog>=24.4",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ARG", "PTH", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
    "network: test requires external network access (deselect with -m 'not network')",
]

[tool.coverage.run]
source = ["core"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
